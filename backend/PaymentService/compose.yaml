services:
  df.paymentservice.api:
    image: df.paymentservice.api
    build:
      context: .
      dockerfile: DF.PaymentService.API/Dockerfile
    container_name: df.paymentservice.api
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=df.paymentservice.db;Port=5432;Database=PaymentServiceDb;Username=PaymentService;Password=PaymentService2025!
    depends_on:
      - df.paymentservice.db
    networks:
      - df-network

  df.paymentservice.db:
    image: postgres:16
    container_name: df.paymentservice.db
    environment:
      POSTGRES_USER: PaymentService
      POSTGRES_PASSWORD: PaymentService2025!
      POSTGRES_DB: PaymentServiceDb
    ports:
      - "5436:5432"
    volumes:
      - payment_service_data:/var/lib/postgresql/data
    networks:
      - df-network

volumes:
  payment_service_data:

networks:
  df-network:
    external: true
