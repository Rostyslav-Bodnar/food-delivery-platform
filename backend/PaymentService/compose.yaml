services:
  df.paymentservice.api:
    image: df.paymentservice.api
    build:
      context: .
      dockerfile: DF.PaymentService.API/Dockerfile
    container_name: df.paymentservice.api
    ports:
      - "5007:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=df.paymentservice.db;Port=5432;Database=PaymentServiceDb;Username=PaymentService;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      RabbitMQ__Url: ${RABBITMQ_URL:?RABBITMQ_URL is required}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
      Internal__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      Jwt__Issuer: df.auth
      Jwt__Audience: df.client
      AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:5173}
    depends_on:
      - df.paymentservice.db
    networks:
      - df-network

  df.paymentservice.db:
    image: postgres:16
    container_name: df.paymentservice.db
    environment:
      POSTGRES_USER: PaymentService
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: PaymentServiceDb
    ports:
      - "5436:5432"
    volumes:
      - payment_service_data:/var/lib/postgresql/data
    networks:
      - df-network

volumes:
  payment_service_data:

networks:
  df-network:
    external: true
