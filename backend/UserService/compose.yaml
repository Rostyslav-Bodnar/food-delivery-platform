version: '3.9'

services:
  df.userservice.api:
    image: df.userservice.api
    build:
      context: .
      dockerfile: DF.UserService.API/Dockerfile
    container_name: df.userservice.api
    ports:
      - "5000:10000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__UserServiceDatabase: Host=df.userservice.db;Port=5432;Database=UserServiceDb;Username=UserService;Password=UserService2025!
      Jwt__Key: food-delivery-platform-jwt-key-1234567890!
      RabbitMQ__Url: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      df.userservice.db:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - df-network

  df.userservice.db:
    image: postgres:16
    container_name: df.userservice.db
    environment:
      POSTGRES_USER: UserService
      POSTGRES_PASSWORD: UserService2025!
      POSTGRES_DB: UserServiceDb
    ports:
      - "5433:5432"
    volumes:
      - user_service_data:/var/lib/postgresql/data
    networks:
      - df-network
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - df-network

volumes:
  user_service_data:

networks:
  df-network:
    external: true
