name: UserService CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/UserService/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read

concurrency:
  group: userservice-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'

jobs:

  # =========================
  # CI
  # =========================
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/UserService

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      # ✅ ВАЖЛИВО: додаємо auth до GitHub Packages
      - name: Setup NuGet auth
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --force
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Restore
        run: dotnet restore DF.UserService.sln

      - name: Build
        run: dotnet build DF.UserService.sln -c Release --no-restore

      - name: Test
        run: dotnet test DF.UserService.sln -c Release --no-build


  # =========================
  # DOCKER
  # =========================
  docker:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: backend/UserService
          file: backend/UserService/Dockerfile

          push: ${{ github.ref == 'refs/heads/main' }}

          build-args: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

          tags: |
            ghcr.io/${{ github.repository_owner }}/userservice:latest
            ghcr.io/${{ github.repository_owner }}/userservice:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # =========================
  # DEPLOY
  # =========================
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy
        run: |
          curl --fail --silent --show-error \
            -X POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.USERSERVICE_RENDER_DEPLOY_HOOK }}