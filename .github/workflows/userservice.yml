name: UserService CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/UserService/**'
      - '.github/workflows/userservice.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/UserService/**'

concurrency:
  group: userservice-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  WORKING_DIR: backend/UserService
  IMAGE_NAME: userservice

jobs:

  # =========================================================
  # BUILD + TEST
  # =========================================================
  build-test:
    name: Build & Test

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # SETUP .NET
      # =========================================================
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # =========================================================
      # CACHE NUGET
      # =========================================================
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}

      # =========================================================
      # RESTORE
      # =========================================================
      - name: Restore dependencies
        run: dotnet restore --configfile nuget.config
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # =========================================================
      # TEST
      # =========================================================
      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity minimal

  # =========================================================
  # DOCKER BUILD
  # =========================================================
  docker:
    name: Docker Build & Push

    needs: build-test

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # SETUP DOCKER BUILDX
      # =========================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================================================
      # LOGIN TO GHCR
      # =========================================================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================
      # BUILD & PUSH
      # =========================================================
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/UserService
          file: ./backend/UserService/Dockerfile

          push: ${{ github.ref == 'refs/heads/main' }}

          tags: |
            ghcr.io/${{ github.repository_owner }}/userservice:latest
            ghcr.io/${{ github.repository_owner }}/userservice:${{ github.sha }}

          build-args: |
            GITHUB_USERNAME=${{ github.repository_owner }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================
  # DEPLOY
  # =========================================================
  deploy:
    name: Deploy to Render

    needs:
      - docker

    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:

      # =========================================================
      # TRIGGER RENDER DEPLOY
      # =========================================================
      - name: Trigger Render deployment
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.USERSERVICE_RENDER_DEPLOY_HOOK }}