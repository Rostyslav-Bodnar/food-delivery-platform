name: UserService CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/UserService/**'
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  WORKING_DIR: backend/UserService

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # .NET SETUP
      # =========================
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # =========================
      # NUGET CACHE (speed boost)
      # =========================
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}

      # =========================
      # AUTH FOR GITHUB PACKAGES
      # =========================
      - name: Setup GitHub NuGet auth
        run: |
          dotnet nuget add source \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username ${{ github.repository_owner }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text

      # =========================
      # RESTORE
      # =========================
      - name: Restore
        run: dotnet restore

      # =========================
      # BUILD
      # =========================
      - name: Build
        run: dotnet build -c Release --no-restore

      # =========================
      # TEST
      # =========================
      - name: Test
        run: dotnet test -c Release --no-build --logger trx

  deploy:
    name: Deploy to Render
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy Hook
        run: curl -X POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.USERSERVICE_RENDER_DEPLOY_HOOK }}