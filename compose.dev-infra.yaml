# Hybrid local dev: this file brings up INFRA ONLY (databases, RabbitMQ, Redis).
# Microservices and the gateway run on the host via `dotnet run` / IDE, the
# frontend via `npm run dev`. Service-specific compose files in backend/*/
# stay for the all-Docker path; ignore them when using this file.
#
#   docker network create df-network   (one-time, idempotent)
#   docker compose -f compose.dev-infra.yaml up -d
#
# Each microservice's appsettings.Development.json + launchSettings.json must
# point at localhost:<host-port> below.

services:
  # ---------------------------------------------------------------
  # Postgres instances — one per service
  # ---------------------------------------------------------------
  df.userservice.db:
    image: postgres:16
    container_name: df.userservice.db
    environment:
      POSTGRES_USER: UserService
      POSTGRES_PASSWORD: UserService2025!
      POSTGRES_DB: UserServiceDb
    ports:
      - "5433:5432"
    volumes:
      - user_service_data:/var/lib/postgresql/data
    networks: [df-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U UserService -d UserServiceDb"]
      interval: 5s
      timeout: 3s
      retries: 10

  df.menuservice.db:
    image: postgres:16
    container_name: df.menuservice.db
    environment:
      POSTGRES_USER: MenuService
      POSTGRES_PASSWORD: MenuService2025!
      POSTGRES_DB: MenuServiceDb
    ports:
      - "5434:5432"
    volumes:
      - menu_service_data:/var/lib/postgresql/data
    networks: [df-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U MenuService -d MenuServiceDb"]
      interval: 5s
      timeout: 3s
      retries: 10

  df.orderservice.db:
    image: postgres:16
    container_name: df.orderservice.db
    environment:
      POSTGRES_USER: OrderService
      POSTGRES_PASSWORD: OrderService2025!
      POSTGRES_DB: OrderServiceDb
    ports:
      - "5435:5432"
    volumes:
      - order_service_data:/var/lib/postgresql/data
    networks: [df-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U OrderService -d OrderServiceDb"]
      interval: 5s
      timeout: 3s
      retries: 10

  df.paymentservice.db:
    image: postgres:16
    container_name: df.paymentservice.db
    environment:
      POSTGRES_USER: PaymentService
      POSTGRES_PASSWORD: PaymentService2025!
      POSTGRES_DB: PaymentServiceDb
    ports:
      - "5436:5432"
    volumes:
      - payment_service_data:/var/lib/postgresql/data
    networks: [df-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U PaymentService -d PaymentServiceDb"]
      interval: 5s
      timeout: 3s
      retries: 10

  df.trackingservice.db:
    image: postgis/postgis:16-3.4
    container_name: df.trackingservice.db
    environment:
      POSTGRES_USER: TrackingService
      POSTGRES_PASSWORD: TrackingService2025!
      POSTGRES_DB: TrackingServiceDb
    ports:
      - "5437:5432"
    volumes:
      - tracking_service_data:/var/lib/postgresql/data
    networks: [df-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U TrackingService -d TrackingServiceDb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------
  # Shared infra
  # ---------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI: http://localhost:15672  (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks: [df-network]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  df.redis:
    image: redis:7.2-alpine
    container_name: df.redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks: [df-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  user_service_data:
  menu_service_data:
  order_service_data:
  payment_service_data:
  tracking_service_data:
  redis_data:

networks:
  df-network:
    external: true
